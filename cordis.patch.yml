# dsh-waifu bundle patch: inserts the plugin row into the web roster.
# 安装：`dsh plugin --profile web add dsh-waifu`（官方 publish.md 流程）
# config 是插件默认值 base 层（schema 默认 → base → 用户层），
# 用户可在「桌宠配置」设置面板覆盖；model 存内置预设 id（presets.jsonc）。
- insert:
    - id: dsh-waifu
      name: dsh-waifu
      config:
        model: jian
        debug: false
